<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>demo chat room</title>
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
		integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
		crossorigin="anonymous"></script>
	<meta name="htmx-config" content='{"selfRequestsOnly":false}'>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
		crossorigin="anonymous">
</head>

<body>
	<!--  header -->
	<nav class="navbar navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">chat</a>
		</div>
	</nav>


	<!--  body -->
	<div id="chat-window" class="bg-light d-flex flex-column-reverse p-3" style="height: 80vh; overflow-y: auto;">
		<div id="chat-messages" class="d-flex flex-column">
			<div class="text-center text-muted small py-2">
				Gracias por ayudar ❤️
			</div>

		</div>
	</div>

	<!--  input -->
	<div class="p-3 bg-white border-top">
		<div class="input-group">
			<input type="text" name="msg" id="message-input" class="form-control"
				placeholder="Escribe un mensaje..." autocomplete="off">
			<button class="btn btn-primary" onclick="sendMsg()">Send</button>
		</div>
	</div>

	<script>
		let msgsValues = [];
		const host = window.location.hostname;
		console.log(host);
		const socket = new WebSocket(`ws://${host}:3000/msg`);
		socket.onmessage = (event) => {
			// when i recive a response from the server;
			let d = JSON.parse(event.data)
			msgsValues.push({
				text: d.text,
				send: 'bot'
			})
			renderMsgs()
		};

		socket.onopen = () => {
			// do somthing when the conexion is open
		};

		function sendMsg() {
			const input = document.getElementById('message-input');
			const msg = input.value;
			input.value = "";
			let msgToSend = JSON.stringify({
				text: msg || ""
			})
			msgsValues.push({
				text: msg,
				send: 'human'
			})
			socket.send(msgToSend)
		}

		function renderMsgs() {
			const container = document.getElementById('chat-messages');

			const msgs = msgsValues;
			console.log(msgs)

			// 1. Clear container (optional)
			container.innerHTML = '';

			// 2. Loop through the array
			msgs.forEach(msg => {
				let html = '';

				if (msg.send === 'bot') {
					// Bot: Gray background, aligned to START (left)
					html = `
                <div class="alert alert-secondary mb-2 align-self-start" style="max-width: 80%;">
                    ${msg.text}
                </div>`;
				} else {
					// Human: Blue background, aligned to END (right)
					html = `
                <div class="alert alert-primary mb-2 align-self-end" style="max-width: 80%;">
                    ${msg.text}
                </div>`;
				}

				container.insertAdjacentHTML('beforeend', html);
			});

			// 4. Auto-scroll to bottom after loading
			container.scrollTop = container.scrollHeight;
		}
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
</body>
