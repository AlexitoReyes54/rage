services:
  db:
    image: postgres:16
    container_name: rage_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rage-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: bun-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db

  redis:
    image: redis:alpine
    container_name: rage_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - db_data:/var/lib/redis/data

volumes:
  db_data:


