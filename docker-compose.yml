services:
  db:
    image: postgres:16
    container_name: rage_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rage-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: rage_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: .
    container_name: bun-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
      - chroma
      - redis

  redis:
    image: redis:alpine
    container_name: rage_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  chroma_data:
  redis_data:
