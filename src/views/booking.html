<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
		crossorigin="anonymous">

	<!-- htmx -->
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
		integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
		crossorigin="anonymous"></script>
	<meta name="htmx-config" content='{"selfRequestsOnly":false}'>
	<script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>

</head>

<body>
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>


	<!-- As a heading -->
	<nav class="navbar bg-body-tertiary">
		<div class="container-fluid">
			<span class="navbar-brand mb-0 h1">ChatPilot</span>
		</div>
	</nav>


	<br>

	<!-- datepicker related -->
	<div id="step-date">

		<div class="d-flex justify-content-center align-items-center flex-column">
			<h2 class="pb-4">Seleccionar fecha de preferencia</h2>
			<input id="date-picker" hidden />
		</div>
		<br>
		<br>


		<div id="response-container"></div>
	</div>


	<!-- time related -->
	<div id="step-time">
		<div id="times" class="d-flex p-2 flex-column justify-content-center  ">

			<div id="times" class="d-flex p-2  align-items-center justify-content-center  ">
				<h2 class="pb-4 center">Seleccionar hora de preferencia</h2>
			</div>


		</div>
	</div>

	<!-- Modal -->
	<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="exampleModalLabel">Confirmar datos</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>

				<div class="modal-body">
					<p class="modal-body-text"></p>
					<br>
					<br>


					<!-- here i have to capture the user name  -->
					<label for="">cual es su nombre ? </label>
					<input type="text" id="lead-name" name="small" value="juan">
				</div>

				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Cerrar</button>

					<button id="book-btn" type="button" class="btn btn-primary"
						hx-post="/booking/save" hx-vals="js:{...getBookingRequestValues()}"
						hx-ext="json-enc">Agendar</button>

				</div>
			</div>
		</div>
	</div>

	<script>
		// 1. validate the user id is valid - done backened
		// 2. load the UI
		// 3. send the data the backendc
		// 4. provide feedback about the server response
		// 5. show success screen or failure
		// 6. 

		// i need to validate that there is a param for me to save have a number to display in the dashboard

		const ERROR_URL = '/not-valid';
		const SUCCESS_URL = '/successful';
		const REQUIRED_PARAM = 'contact';

		// lobal variables fo the view
		var dateString = null;


		const urlParams = new URLSearchParams(window.location.search);
		let contactNumber = urlParams.get("contact");
		let leadName = '';

		const currentUrl = window.location.href;
		const segments = new URL(currentUrl)
			.pathname.split('/')
			.filter(segment => segment !== "");
		const userId = segments[segments.length - 1];


		if (!urlParams.has(REQUIRED_PARAM)) {
			window.location.pathname = ERROR_URL;
		}

		// todo this btn is only enabled when the value of the input for the name/
		// id not empty 
		document.getElementById('book-btn').addEventListener('click', () => {

			leadName = document.getElementById('lead-name').value;


			// TODO hold on is there a meeting at this time ????
			// dont worry about that for  now
		})

		function getBookingRequestValues() {

			let x = {
				id: "",
				date: dateString,
				userId: userId,
				description: "",    // Opcional en Zod, inicializado como string vacío
				conversationID: 3,   // Tipo number, inicializado en 0 para evitar null/undefined
				leadName: leadName        // Opcional en Zod, inicializado como string vacío
			};

			console.log(x)
			return x;
		}

		function render() {
			if (dateString === null) {
				document.getElementById('step-time').style.display = 'none'
				document.getElementById('step-date').style.display = 'block'
			} else {
				document.getElementById('step-time').style.display = 'block'
				document.getElementById('step-date').style.display = 'none'
			}

		}


		// timeObj: {text: "08:00 AM", value: [8, 0]},
		function updateTimeToDate(timeObj) {

			if (!dateString) {
				// error here...
				// what to do here ???
				return;
			}


			let isoFormatedDate = new Date(dateString)
			let timeUpdated = isoFormatedDate.setUTCHours(timeObj.value[0], timeObj.value[1])
			console.log('updated: ', isoFormatedDate.toISOString())

			dateString = isoFormatedDate.toISOString();
		}

		function sendToServer() {
			// do something...
			// this has to be replaced with htmx probably...
		}

		function resetDateTimeState() {
			dateString = null,
				render();
		}

		// TODO add go back btn in the time step view
		function logState() {
			console.log('-----------------------')
			console.log('CURRNT STATE')
			console.log(dateString)
			console.log('-----------------------')
		}

		// TODO have to fix the modal text generation based on the 
		// date string in iso format 
		function updateModalText() {

			if (dateString !== null) {
				const modalBody = document.querySelector('.modal-body-text');

				let iso = new Date(dateString)

				const options = {
					weekday: 'long',   // 'short' (mié), 'long' (miércoles)
					year: 'numeric',   // 'numeric' (2026), '2-digit' (26)
					month: 'long',     // 'short' (jun), 'long' (junio)
					day: 'numeric'     // 'numeric' (24)
				};

				const readableString = iso.toLocaleDateString('es-ES', options);



				console.log(readableString);
				let time = iso.toLocaleTimeString('en-US');


				// Cambiamos 'en-US' por 'es-ES' (España) o 'es-MX' (México), etc.
				modalBody.textContent =  'Agendo su cita para: ' +  readableString + ' - ' + time;

			}

		}


		let timesObject = [
			{text: "08:00 AM", value: [8, 0]},
			{text: "08:30 AM", value: [8, 30]},
			{text: "09:00 AM", value: [9, 0]},
			{text: "09:30 AM", value: [9, 30]},
			{text: "10:00 AM", value: [10, 0]},
			{text: "10:30 AM", value: [10, 30]},
			{text: "11:00 AM", value: [11, 0]},
			{text: "11:30 AM", value: [11, 30]},
			{text: "12:00 PM", value: [12, 0]},
			{text: "12:30 PM", value: [12, 30]},
			{text: "01:00 PM", value: [13, 0]},
			{text: "01:30 PM", value: [13, 30]},
			{text: "02:00 PM", value: [14, 0]},
			{text: "02:30 PM", value: [14, 30]},
			{text: "03:00 PM", value: [15, 0]},
			{text: "03:30 PM", value: [15, 30]},
			{text: "04:00 PM", value: [16, 0]},
			{text: "04:30 PM", value: [16, 30]},
			{text: "05:00 PM", value: [17, 0]},
			{text: "05:30 PM", value: [17, 30]},
			{text: "06:00 PM", value: [18, 0]}
		];


		let timesContainer = document.getElementById('times')

		timesObject.forEach((val) => {
			let btn = document.createElement('button');
			btn.className = 'btn btn-light border mt-2'
			btn.textContent = val.text;
			btn.setAttribute('data-bs-toggle', 'modal');
			btn.setAttribute('data-bs-target', '#confirmModal');

			btn.addEventListener('click', () => {
				updateTimeToDate(val)
				logState()
				updateModalText()
			})

			timesContainer.append(btn)
		})


		// datepicker
		const element = document.getElementById("date-picker");
		const fp = flatpickr(element, {
			dateFormat: "Y-m-d H:i",
			inline: true,
			enableTime: false,

			// hooks
			onReady: () => {
				render();
			},

			onChange: (seledtedDate, dateStr, instance) => {


				console.log(dateString)
				dateString = dateStr;
				logState()
				render()
			}
		});

	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>


</html>
