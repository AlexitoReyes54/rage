process: # process
  process_id1:
    name: "process_id1 name"
    description: "process_id1 description"
    
    #conditional
    if:
      condition: "user_age > 10"
      then: #(steps)
        - action: "some action"
        - next: END # END means that it goes to the step section that is required
      else: #(steps)
        - action: "some action"
        - link: "proecess ide of the next step"

    steps: # (steps) represent the actions to be taken in the process
      - collect:
          name: "user_name"
          type: "string"
          note: "optional relevant information for the model"
          validation: ">= 0" # Prevent negative ages
      - collect:
          name: "user_age"
          type: "string"
          note: "optional relevant information for the model"
          validation: ">= 0" # Prevent negative ages
      - link: "proecess ide of the next step"

  process_id2:
    name: "process_id2 name"
    description: "process_id2 description"

    steps: #represent the actions to be taken in the process
      - collect:
          name: "user_name"
          type: "string"
          note: "optional relevant information for the model"
          validation: ">= 0" # Prevent negative ages
      - collect:
          name: "user_age"
          type: "string"
          note: "optional relevant information for the model"
          validation: ">= 0" # Prevent negative ages
      - link: "proecess ide of the next step"

